<svg xmlns="http://www.w3.org/2000/svg" width="860" height="484" viewBox="0 0 860 484" role="img" aria-label="Terminal replay of jwt-audit on its sample data"><style>text{font:14px ui-monospace,Menlo,Consolas,monospace;fill:#d6deeb}.p{fill:#7fdbca}.c{fill:#ecc48d}.h{fill:#ff6b6b}.m{fill:#f78c6c}.l{fill:#82aaff}.i{fill:#8a96a8}@keyframes t{from{opacity:0}to{opacity:1}}.r{animation:t .01s backwards}.d0{animation-delay:0.40s}.d1{animation-delay:0.75s}.d2{animation-delay:1.10s}.d3{animation-delay:1.45s}.d4{animation-delay:1.80s}.d5{animation-delay:2.15s}.d6{animation-delay:2.50s}.d7{animation-delay:2.85s}.d8{animation-delay:3.20s}.d9{animation-delay:3.55s}.d10{animation-delay:3.90s}.d11{animation-delay:4.25s}.d12{animation-delay:4.60s}.d13{animation-delay:4.95s}.d14{animation-delay:5.30s}.d15{animation-delay:5.65s}</style><rect width="860" height="484" rx="10" fill="#011627"/><rect width="860" height="34" rx="10" fill="#0b2942"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/><text x="430" y="22" text-anchor="middle" class="i">jwt-audit</text><text x="20" y="64" xml:space="preserve"><tspan class="p">$ </tspan>./target/release/jwt-audit examples/tokens.txt --now 1763100000</text><text class="r d0 " x="20" y="108" xml:space="preserve">7 tokens, 12 findings</text><text class="r d1 h" x="20" y="130" xml:space="preserve">CRITICAL JWT001 line 2 (alg=none)</text><text class="r d2 " x="20" y="152" xml:space="preserve">         no signature algorithm: any token can be forged</text><text class="r d3 h" x="20" y="174" xml:space="preserve">HIGH     JWT002 line 4 (alg=RS256)</text><text class="r d4 " x="20" y="196" xml:space="preserve">         &#x27;jku&#x27; header lets the token point at its own verification key; ignore it and use a fixed key se</text><text class="r d5 h" x="20" y="218" xml:space="preserve">HIGH     JWT003 line 4 (alg=RS256)</text><text class="r d6 " x="20" y="240" xml:space="preserve">         &#x27;kid&#x27; contains path, SQL or shell characters: classic injection vector</text><text class="r d7 h" x="20" y="262" xml:space="preserve">HIGH     JWT004 line 5 (alg=ES256)</text><text class="r d8 " x="20" y="284" xml:space="preserve">         no &#x27;exp&#x27; claim: the token never expires</text><text class="r d9 h" x="20" y="306" xml:space="preserve">HIGH     JWT008 line 5 (alg=ES256)</text><text class="r d10 " x="20" y="328" xml:space="preserve">         payload is readable by anyone and contains claim names that look like secrets: api_key, passwor</text><text class="r d11 m" x="20" y="350" xml:space="preserve">MEDIUM   JWT005 line 2 (alg=none)</text><text class="r d12 " x="20" y="372" xml:space="preserve">         lifetime of 1.0 days: prefer minutes or hours with a refresh token</text><text class="r d13 m" x="20" y="394" xml:space="preserve">MEDIUM   JWT007 line 2 (alg=none)</text><text class="r d14 " x="20" y="416" xml:space="preserve">         missing aud and iss: a token for another service or issuer would be accepted</text><text class="r d15 m" x="20" y="438" xml:space="preserve">MEDIUM   JWT005 line 3 (alg=HS256)</text></svg>
